<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050b0a">
  <meta name="description" content="Официальный информационный портал сообщества Justice Faite. Правила, активность, игры, бот и обновления.">
  <title>Justice Faite — Community Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
    <span class="grain"></span>
  </div>

  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <a class="brand" href="/" data-nav="home" aria-label="Justice Faite — главная">
        <span class="brand-mark">JF</span>
        <span class="brand-text">
          <strong>JUSTICE FAITE</strong>
          <small>COMMUNITY PORTAL</small>
        </span>
      </a>

      <nav class="main-nav" id="mainNav" aria-label="Основная навигация"></nav>

      <div class="header-actions">
        <button class="search-toggle glass-btn" id="searchToggle" type="button" aria-label="Открыть поиск">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <button class="menu-toggle" id="menuToggle" type="button" aria-label="Меню" aria-expanded="false">
          <i></i><i></i><i></i>
        </button>
      </div>
    </div>

    <div class="search-panel" id="searchPanel" hidden>
      <div class="search-box glass">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="searchInput" placeholder="Поиск по порталу…" autocomplete="off" aria-label="Поиск">
        <button type="button" class="search-clear" id="searchClear" hidden aria-label="Очистить">×</button>
      </div>
      <div class="search-filters" id="searchFilters"></div>
      <div class="search-results" id="searchResults" role="listbox"></div>
    </div>

    <div class="mobile-nav" id="mobileNav" hidden></div>
  </header>

  <main id="app" class="app-shell" aria-live="polite">
    <div class="loading-state">
      <span class="loading-ring"></span>
      <span>Загружаем портал…</span>
    </div>
  </main>

  <footer class="site-footer" id="siteFooter">
    <div class="footer-inner">
      <div class="footer-brand">
        <strong>JUSTICE FAITE</strong>
        <span>Community Portal · 16+</span>
      </div>
      <div class="footer-links" id="footerLinks"></div>
      <div class="footer-meta">
        <span id="footerVersion">v2.0.0</span>
        <span>·</span>
        <span id="footerYear">2026</span>
      </div>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/app.js" defer></script>
</body>
</html>
